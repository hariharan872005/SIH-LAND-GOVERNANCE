services:
  # 1. PostgreSQL + PostGIS (Authoritative Transactional & Spatial DB)
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: bhu_postgres_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_land_pass
      POSTGRES_DB: bhu_twin_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhu_twin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhu_network

  # 2. Neo4j (Ownership Graph & Lineage Engine)
  neo4j:
    image: neo4j:5.18-community
    container_name: bhu_neo4j_graph
    environment:
      NEO4J_AUTH: neo4j/neo4j_secret_pass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_secret_pass 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhu_network

  # 3. Redis (High-Performance Cache & Rate Limiter)
  redis:
    image: redis:7.2-alpine
    container_name: bhu_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhu_network

  # 4. Zookeeper (Kafka Coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bhu_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bhu_network

  # 5. Apache Kafka (Asynchronous Event Broker)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bhu_kafka_events
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bhu_network

  # 6. MinIO (S3-Compatible Object Vault for Certified Deeds)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: bhu_minio_s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_pass
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - miniodata:/data
    networks:
      - bhu_network

  # 7. OpenSearch (Read-Optimized Cadastral Search Layer)
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: bhu_opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    networks:
      - bhu_network

volumes:
  pgdata:
  neo4jdata:
  redisdata:
  miniodata:
  opensearchdata:

networks:
  bhu_network:
    driver: bridge
